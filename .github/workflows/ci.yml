# Builds, tests and style-checks every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build, test and check style
        run: chmod +x mvnw && ./mvnw -B verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  api-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Start the service (H2 profile)
        run: |
          chmod +x mvnw
          ./mvnw -B -q -DskipTests package
          nohup java -jar target/pulseguard-0.1.0-SNAPSHOT.jar --spring.profiles.active=h2 > app.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8080/metrics && break; sleep 2; done
      - name: Run Postman collection with Newman
        run: npx --yes newman run postman/PulseGuard.postman_collection.json
      - name: Run demo collection with Newman
        run: npx --yes newman run postman/PulseGuard-demo.postman_collection.json --env-var baseUrl=http://localhost:8080
      - name: Show service log on failure
        if: failure()
        run: cat app.log
