spring.application.name=pulseguard
server.port=${PORT:8080}

# PostgreSQL (local: docker compose up -d; cloud: set DB_URL, DB_USER, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pulseguard}
spring.datasource.username=${DB_USER:pulseguard}
spring.datasource.password=${DB_PASSWORD:pulseguard}

# Hibernate creates and updates the tables from the entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
