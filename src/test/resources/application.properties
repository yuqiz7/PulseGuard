# Tests use an in-memory H2 database, so mvn test needs no running PostgreSQL.
spring.application.name=pulseguard
spring.datasource.url=jdbc:h2:mem:pulseguard;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
